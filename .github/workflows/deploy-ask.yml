# ============================================================================
# deploy-ask — plan the Ask function on a pull request, apply it on merge
# ============================================================================
# The Ask function is deployed from THIS repo, because the rules repo is what
# pins the box's behaviour and cuts the releases the box serves. It runs
# Terraform against the `ask-function` module (copy templates/ask-function/ from
# the uvularia source into this repo as `ask-function/`), assuming a role in your
# AWS account over GitHub OIDC — no long-lived AWS keys in a secret.
#
# What it does:
#   * a `gate` job that must pass before anything is planned or applied: the
#     function's unit tests and `terraform fmt`/`validate`;
#   * on a pull request, `terraform plan`, posted as a comment, so a human sees
#     the change before it lands;
#   * on merge to main, `terraform apply`.
#
# What you must set (Settings → Secrets and variables → Actions → Variables),
# none of which is Lentago-specific:
#   ASK_DEPLOY_ROLE_ARN   the IAM role to assume over OIDC (trusts this repo)
#   ASK_TF_STATE_BUCKET   the S3 bucket holding Terraform state
#   ASK_TF_STATE_KEY      the state object key for this deployment
#   AWS_REGION            the region to deploy into
#   ASK_PUBLISHED_BASE_URL, ASK_ALLOWED_ORIGIN, ASK_API_KEY_SSM_PATH
#                         the module's client-specific inputs (see its variables)
#   LOKI_PUSH_URL, LOKI_WRITE_TOKEN_SSM_PATH, LOKI_CLUSTER
#                         optional: pipeline events to your own Grafana Cloud
#                         Loki. Unset, the function sends none.
#
# The box's own guards (cap, SSM key, Turnstile) mean this workflow grants no
# secret beyond the OIDC role's own permissions.
# ============================================================================

name: deploy-ask

on:
  pull_request:
    paths: ["ask-function/**", ".github/workflows/deploy-ask.yml"]
  push:
    branches: [main]
    paths: ["ask-function/**", ".github/workflows/deploy-ask.yml"]

permissions:
  contents: read
  id-token: write        # OIDC: mint a token to assume the AWS role
  pull-requests: write   # post the plan as a comment

env:
  MODULE_DIR: ask-function/terraform
  TF_IN_AUTOMATION: "true"
  # The module's client-specific inputs, from repo variables.
  TF_VAR_published_base_url: ${{ vars.ASK_PUBLISHED_BASE_URL }}
  TF_VAR_allowed_origin: ${{ vars.ASK_ALLOWED_ORIGIN }}
  TF_VAR_anthropic_api_key_ssm_path: ${{ vars.ASK_API_KEY_SSM_PATH }}
  TF_VAR_rules_repo: ${{ github.repository }}
  # Optional pipeline events; empty values leave the function's pusher a no-op.
  TF_VAR_loki_push_url: ${{ vars.LOKI_PUSH_URL }}
  TF_VAR_loki_write_token_ssm_path: ${{ vars.LOKI_WRITE_TOKEN_SSM_PATH }}
  TF_VAR_loki_cluster: ${{ vars.LOKI_CLUSTER }}

concurrency:
  group: deploy-ask
  cancel-in-progress: false

jobs:
  # The gate: nothing is planned or applied unless this is green.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Function unit tests
        run: |
          if [ -d ask-function/tests ]; then
            python3 -m unittest discover -s ask-function/tests -p "test_*.py" -v
          else
            echo "::warning::ask-function/ not vendored into this repo; skipping unit tests."
          fi
      - uses: hashicorp/setup-terraform@v3
      - name: Format and validate
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  plan:
    needs: gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ASK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the function package
        # Built here, on every run, rather than trusted to the module's
        # null_resource: that resource re-runs only when the sources change, so
        # a fresh runner with unchanged sources would have no zip to deploy.
        working-directory: ${{ env.MODULE_DIR }}
        run: bash ./build.sh
      - name: Write the S3 backend block
        working-directory: ${{ env.MODULE_DIR }}
        run: printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf
      - name: Init
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.ASK_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.ASK_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Plan
        id: plan
        working-directory: ${{ env.MODULE_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
      - name: Post the plan as a comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- uvularia-ask-plan -->';
            let plan = '';
            try { plan = fs.readFileSync('${{ env.MODULE_DIR }}/plan.txt', 'utf8'); }
            catch (e) { plan = 'No plan output.'; }
            const clip = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `${marker}\n## Ask function — Terraform plan\n\n\`\`\`\n${clip}\n\`\`\``;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  apply:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ASK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the function package
        # Built here, on every run, rather than trusted to the module's
        # null_resource: that resource re-runs only when the sources change, so
        # a fresh runner with unchanged sources would have no zip to deploy.
        working-directory: ${{ env.MODULE_DIR }}
        run: bash ./build.sh
      - name: Write the S3 backend block
        working-directory: ${{ env.MODULE_DIR }}
        run: printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf
      - name: Init
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.ASK_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.ASK_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Apply
        working-directory: ${{ env.MODULE_DIR }}
        run: terraform apply -input=false -auto-approve
