# ============================================================================
# release — on merge to main, cut a rules-vN release your Ask function pins
# ============================================================================
# Tags the merge commit `rules-v<N>` (the next integer after the highest existing
# rules-v* tag) and publishes policy.yaml and instructions.md as the release
# assets the Ask function downloads at a fixed version. The function advances only
# when a newer release exists; rolling back is pinning the previous rules-vN.
#
# A release is the unit of "this is how the box behaves now" — frozen, versioned,
# and reversible. One is cut on every merge so the pinned version always matches
# main.
# ============================================================================

name: release

on:
  push:
    branches: [main]

permissions:
  contents: write   # create the tag and the release

concurrency:
  group: rules-release   # one release at a time, so the version never races
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # need the tag history to compute the next version

      - name: Compute the next rules version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          latest="$(git tag -l 'rules-v*' | sed 's/^rules-v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          next=$(( ${latest:-0} + 1 ))
          echo "tag=rules-v${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: rules-v${next}"

      - name: Create the release with the pinned assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            policy.yaml instructions.md \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes "Rules release pinned by the Ask function. Assets: policy.yaml, instructions.md. Roll back by pinning the previous rules-vN."

      # --- Telemetry (optional; see README "Watch the pipeline") ---------------
      # Records which rules release is now the one the Ask function can pin, in
      # your own Grafana Cloud Loki when LOKI_PUSH_URL is set. Unset, it prints
      # one "telemetry not configured" line. Neither step can fail the release.
      - name: Telemetry — describe this release
        id: telemetry
        if: always()
        continue-on-error: true
        env:
          LOKI_PUSH_URL: ${{ vars.LOKI_PUSH_URL }}
          LOKI_CLUSTER: ${{ vars.LOKI_CLUSTER }}
          LOKI_TOKEN_SET: ${{ secrets.LOKI_WRITE_TOKEN != '' }}
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 scripts/telemetry.py rules_released --tag "$TAG" --job-status "$JOB_STATUS"

      - name: Telemetry — push the rules_released event
        if: always() && steps.telemetry.outputs.enabled == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/loki-event
        with:
          loki_url: ${{ vars.LOKI_PUSH_URL }}
          loki_token: ${{ secrets.LOKI_WRITE_TOKEN }}
          cluster: ${{ steps.telemetry.outputs.cluster }}
          source: uvularia
          pipeline: rules
          stage: rules_released
          payload-json: ${{ steps.telemetry.outputs.payload }}
